<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11998e"/>
      <stop offset="1" stop-color="#38ef7d"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="16" fill="#0d1117"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#e6edf3">为什么文章会“凭空消失”？</text>
  <text x="40" y="92" font-size="17" fill="#8b949e">Jekyll 默认 future: false —— 发布时间晚于“现在”的文章不会被构建</text>
  <line x1="60" y1="230" x2="900" y2="230" stroke="#30363d" stroke-width="3"/>
  <polygon points="900,230 884,222 884,238" fill="#30363d"/>
  <text x="836" y="270" font-size="15" fill="#6b7280">时间</text>
  <line x1="380" y1="180" x2="380" y2="280" stroke="url(#g2)" stroke-width="3"/>
  <circle cx="380" cy="230" r="9" fill="#38ef7d"/>
  <text x="345" y="170" font-size="20" font-weight="700" fill="#38ef7d">现在 17:32</text>
  <g transform="translate(150,120)">
    <rect width="150" height="80" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="16" y="32" font-size="16" fill="#7ee787">10:00 发布</text>
    <text x="16" y="58" font-size="14" fill="#8b949e">正常显示</text>
  </g>
  <line x1="225" y1="200" x2="225" y2="230" stroke="#238636" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="225" cy="230" r="7" fill="#238636"/>
  <g transform="translate(620,120)" opacity="0.55">
    <rect width="170" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="6"/>
    <text x="16" y="32" font-size="16" fill="#f85149">20:00 发布</text>
    <text x="16" y="58" font-size="14" fill="#8b949e">被跳过 / 看不到</text>
  </g>
  <line x1="705" y1="200" x2="705" y2="230" stroke="#f85149" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="705" cy="230" r="7" fill="#f85149"/>
  <text x="640" y="330" font-size="15" fill="#f85149">在未来，构建时被过滤</text>
  <rect x="40" y="356" width="880" height="44" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="60" y="384" font-size="16" fill="#79c0ff">修复：把 date 改成不晚于当前时间（并带上 +0800 时区），文章立刻回来</text>
</svg>
