<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f3a"/>
      <stop offset="0.5" stop-color="#2d1b4e"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative dots grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="90" cy="90" r="3"/><circle cx="150" cy="90" r="3"/><circle cx="210" cy="90" r="3"/>
    <circle cx="90" cy="150" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="210" cy="150" r="3"/>
    <circle cx="1110" cy="540" r="3"/><circle cx="1050" cy="540" r="3"/><circle cx="990" cy="540" r="3"/>
    <circle cx="1110" cy="480" r="3"/><circle cx="1050" cy="480" r="3"/><circle cx="990" cy="480" r="3"/>
  </g>

  <!-- floating rocket emoji-ish -->
  <text x="980" y="180" font-size="120" opacity="0.9">🚀</text>

  <!-- terminal window -->
  <g transform="translate(760,300)">
    <rect width="380" height="240" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect width="380" height="40" rx="14" fill="#161b22"/>
    <rect y="20" width="380" height="20" fill="#161b22"/>
    <circle cx="26" cy="20" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="20" r="7" fill="#ffbd2e"/>
    <circle cx="78" cy="20" r="7" fill="#27c93f"/>
    <text x="24" y="86" font-size="20" fill="#7ee787" font-family="monospace">$ git push origin main</text>
    <text x="24" y="120" font-size="20" fill="#79c0ff" font-family="monospace">  Building site...</text>
    <text x="24" y="154" font-size="20" fill="#79c0ff" font-family="monospace">  Deploying to Pages...</text>
    <text x="24" y="188" font-size="20" fill="#7ee787" font-family="monospace">  ✓ Published!</text>
    <text x="24" y="222" font-size="20" fill="#e6edf3" font-family="monospace">$ <tspan fill="#ffffff">▋</tspan></text>
  </g>

  <!-- title block -->
  <text x="80" y="280" font-size="68" font-weight="800" fill="#ffffff" filter="url(#glow)">用 AI</text>
  <text x="80" y="368" font-size="68" font-weight="800" fill="url(#accent)">一个下午</text>
  <text x="80" y="456" font-size="68" font-weight="800" fill="#ffffff">搭起这个博客</text>

  <!-- subtitle -->
  <rect x="80" y="500" width="56" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="548" font-size="28" fill="#b8c0ff">附：一个让文章凭空消失的踩坑实录</text>

  <!-- footer tag -->
  <text x="80" y="592" font-size="22" fill="#6b7280" font-family="monospace">zz9mm.github.io · Chirpy + Jekyll</text>
</svg>
