<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f3a"/>
      <stop offset="0.5" stop-color="#2d1b4e"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f3ff"/>
      <stop offset="1" stop-color="#c3cbe8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative dots grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="90" cy="90" r="3"/><circle cx="150" cy="90" r="3"/><circle cx="210" cy="90" r="3"/>
    <circle cx="90" cy="150" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="210" cy="150" r="3"/>
    <circle cx="1110" cy="540" r="3"/><circle cx="1050" cy="540" r="3"/><circle cx="990" cy="540" r="3"/>
    <circle cx="1110" cy="480" r="3"/><circle cx="1050" cy="480" r="3"/><circle cx="990" cy="480" r="3"/>
  </g>

  <!-- vector rocket (no emoji, font-independent) -->
  <g transform="translate(1000,110) rotate(35)" filter="url(#glow)">
    <!-- flame -->
    <path d="M0,96 C-12,120 -6,150 0,168 C6,150 12,120 0,96 Z" fill="#ffb84d"/>
    <path d="M0,100 C-7,118 -4,140 0,152 C4,140 7,118 0,100 Z" fill="#ff7a45"/>
    <!-- body -->
    <path d="M0,-20 C26,8 30,56 22,96 L-22,96 C-30,56 -26,8 0,-20 Z" fill="url(#rocket)" stroke="#9aa6d6" stroke-width="2"/>
    <!-- window -->
    <circle cx="0" cy="34" r="13" fill="#1f6feb" stroke="#0d1117" stroke-width="3"/>
    <circle cx="0" cy="34" r="5" fill="#cfe6ff"/>
    <!-- fins -->
    <path d="M-22,96 L-44,124 L-22,116 Z" fill="#764ba2"/>
    <path d="M22,96 L44,124 L22,116 Z" fill="#764ba2"/>
    <!-- nose tip -->
    <circle cx="0" cy="-22" r="4" fill="#ff5f56"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(760,300)">
    <rect width="380" height="240" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect width="380" height="40" rx="14" fill="#161b22"/>
    <rect y="20" width="380" height="20" fill="#161b22"/>
    <circle cx="26" cy="20" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="20" r="7" fill="#ffbd2e"/>
    <circle cx="78" cy="20" r="7" fill="#27c93f"/>
    <text x="24" y="86" font-size="20" fill="#7ee787">❯ 推送文章到仓库</text>
    <text x="24" y="120" font-size="20" fill="#79c0ff">  正在构建站点……</text>
    <text x="24" y="154" font-size="20" fill="#79c0ff">  正在部署上线……</text>
    <text x="24" y="188" font-size="20" fill="#7ee787">  ✓ 发布成功！</text>
    <text x="24" y="222" font-size="20" fill="#e6edf3">❯ <tspan fill="#ffffff">▋</tspan></text>
  </g>

  <!-- title block -->
  <text x="80" y="280" font-size="68" font-weight="800" fill="#ffffff" filter="url(#glow)">用 AI</text>
  <text x="80" y="368" font-size="68" font-weight="800" fill="url(#accent)">一个下午</text>
  <text x="80" y="456" font-size="68" font-weight="800" fill="#ffffff">搭起这个博客</text>

  <!-- subtitle -->
  <rect x="80" y="500" width="56" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="548" font-size="28" fill="#b8c0ff">附：一个让文章凭空消失的踩坑实录</text>

  <!-- footer tag -->
  <text x="80" y="592" font-size="22" fill="#6b7280">一个下午 · 零成本 · 全球可访问</text>
</svg>
